services:
  - type: web
    name: disclosure-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_BATCH_SIZE
        value: "32"
      - key: ENRICH_TICKERS
        value: "10"
